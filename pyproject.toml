[project]
name = "docvault"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "lmdb>=1.6",
  "uvicorn[standard]>=0.34",
  "sqlalchemy>=2",
  "docker>=7.1",
]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "hypothesis>=6.170.15",
  "mypy>=1.15",
  "pre-commit>=4.0",
  "pytest>=8.0",
  "pytest-bdd>=8.0",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false


[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true
