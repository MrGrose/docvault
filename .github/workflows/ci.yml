name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run --with pip-audit pip-audit
      - run: uv run --with bandit bandit -q -r src -ll
      - run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=90

  fault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --group dev
      - run: RUN_FAULT_TESTS=1 uv run pytest tests/fault/ -v

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
          python-version: "3.13"
      - run: uv sync --group dev
      - name: Fuzz API
        env:
          DOCVAULT_REPO: ${{ github.workspace }}/data/fuzz
          DOCVAULT_CAPABILITY_SECRET: fuzz-secret
        run: |
          uv run uvicorn main:app --app-dir src --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done
          uv run --with schemathesis schemathesis run http://127.0.0.1:8000/openapi.json --max-examples 20 --checks all --exclude-checks allow_header_conformance
