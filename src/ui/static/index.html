<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DocVault HITL</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <header>
      <h1>HITL review</h1>
      <p class="lede">Изменения, утверждения и цитаты перед публикацией.</p>
    </header>

    <section class="card" aria-labelledby="run-heading">
      <h2 id="run-heading">Run</h2>
      <div class="run-row">
        <label for="draftSelect">Draft</label>
        <select id="draftSelect"><option value="">все черновики</option></select>
        <button type="button" id="refreshBtn">Обновить</button>
      </div>
      <div class="run-row">
        <label for="runSelect">Run</label>
        <select id="runSelect"><option value="">нет прогонов</option></select>
      </div>
      <div class="run-row">
        <label for="runId">Run ID</label>
        <input id="runId" type="text" autocomplete="off" spellcheck="false" placeholder="uuid run" />
        <button type="button" id="loadBtn">Load</button>
      </div>
      <p id="status" class="status-line"></p>
    </section>

    <section class="card" aria-labelledby="diff-heading">
      <h2 id="diff-heading">Изменения</h2>
      <div id="diff" class="diff"></div>
    </section>

    <section class="card" aria-labelledby="claims-heading">
      <h2 id="claims-heading">Claims</h2>
      <div id="claims"></div>
    </section>

    <section class="card" aria-labelledby="verdict-heading">
      <h2 id="verdict-heading">Verdict</h2>
      <p class="warning" id="human-note">
        Смысловую корректность утверждений проверяет человек. Статус grounded значит только,
        что цитата найдена в источнике и утверждение привязано к изменению, а не что оно истинно.
      </p>
      <p class="actions">
        <button type="button" id="acceptBtn">Accept + publish</button>
        <button type="button" id="rejectBtn">Reject</button>
      </p>
      <h2>Result</h2>
      <pre id="result"></pre>
    </section>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
